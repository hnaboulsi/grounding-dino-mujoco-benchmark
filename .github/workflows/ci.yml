name: CI

on:
  push:
  pull_request:

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pytest==9.1.1
      - run: pytest -q
